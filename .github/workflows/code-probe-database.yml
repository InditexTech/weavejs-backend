name: Code probe database

on:
  workflow_dispatch:
    inputs:
      ENVIRONMENT:
        description: "Environment whose database is probed"
        required: true
        type: choice
        options:
          - azure-develop
          - azure-pro
        default: "azure-develop"

permissions:
  contents: read

jobs:
  probe:
    name: Probe database connectivity and privileges
    runs-on: ubuntu-24.04
    environment: ${{ github.event.inputs.ENVIRONMENT }}
    env:
      AZURE_DATABASE_HOST: ${{ secrets.AZURE_DATABASE_HOST }}
      AZURE_DATABASE_PORT: ${{ secrets.AZURE_DATABASE_PORT }}
      AZURE_DATABASE_NAME: ${{ secrets.AZURE_DATABASE_NAME }}
      AZURE_DATABASE_USERNAME: ${{ secrets.AZURE_DATABASE_USERNAME }}
      AZURE_DATABASE_SSL: ${{ secrets.AZURE_DATABASE_SSL }}
      AZURE_DATABASE_PROBE_USERNAME: ${{ secrets.AZURE_DATABASE_PROBE_USERNAME }}
      AZURE_DATABASE_PROBE_PASSWORD: ${{ secrets.AZURE_DATABASE_PROBE_PASSWORD }}
      PGCONNECT_TIMEOUT: "15"
    steps:
      - name: Prepare PostgreSQL credentials
        run: |
          set +x
          if [ -z "$AZURE_DATABASE_PROBE_USERNAME" ] || [ -z "$AZURE_DATABASE_PROBE_PASSWORD" ]; then
            echo "::error::AZURE_DATABASE_PROBE_USERNAME and AZURE_DATABASE_PROBE_PASSWORD must be set in the environment secrets"
            exit 1
          fi
          {
            echo "PGPASSWORD=$AZURE_DATABASE_PROBE_PASSWORD"
            echo "PGHOST=$AZURE_DATABASE_HOST"
            echo "PGPORT=${AZURE_DATABASE_PORT:-5432}"
            echo "PGDATABASE=$AZURE_DATABASE_NAME"
            echo "PGUSER=$AZURE_DATABASE_PROBE_USERNAME"
            if [ "$AZURE_DATABASE_SSL" = "true" ]; then
              echo "PGSSLMODE=require"
            else
              echo "PGSSLMODE=prefer"
            fi
          } >> "$GITHUB_ENV"

      - name: Check psql is available
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi
          psql --version

      - name: Check network path to PostgreSQL
        run: |
          if ! pg_isready --host "$PGHOST" --port "$PGPORT" --timeout 15; then
            echo "::error::PostgreSQL is not reachable from this runner (private endpoint or firewall?)"
            exit 1
          fi

      - name: Check login with Entra token
        run: |
          psql --no-psqlrc --set ON_ERROR_STOP=1 --command "SELECT 1 AS login_ok;" \
            || { echo "::error::Login failed: check AZURE_DATABASE_PROBE_USERNAME/PASSWORD"; exit 1; }

      - name: Check read privileges (counts only)
        run: |
          psql --no-psqlrc --set ON_ERROR_STOP=1 <<'SQL'
          SELECT 'weavejs_room' AS table_name, count(*) AS total FROM weavejs_room
          UNION ALL
          SELECT 'weavejs_room_user', count(*) FROM weavejs_room_user
          UNION ALL
          SELECT 'auth.user', count(*) FROM auth."user";
          SQL

      - name: Report email encryption (counts only)
        run: |
          psql --no-psqlrc --set ON_ERROR_STOP=1 <<'SQL'
          SELECT count(*) AS total,
                 count(*) FILTER (WHERE email LIKE 'enc:%') AS encrypted,
                 count(*) FILTER (WHERE email NOT LIKE 'enc:%') AS plaintext
          FROM auth."user";
          SQL

      - name: Check delete privileges (always rolled back)
        run: |
          psql --no-psqlrc --set ON_ERROR_STOP=1 <<'SQL'
          SELECT count(*) AS rooms_before FROM weavejs_room;
          BEGIN;
          DELETE FROM weavejs_room WHERE false;
          DELETE FROM weavejs_room_user WHERE false;
          ROLLBACK;
          SELECT count(*) AS rooms_after FROM weavejs_room;
          SQL
